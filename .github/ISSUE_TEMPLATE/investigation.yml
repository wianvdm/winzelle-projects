name: Investigation
description: Time-boxed research that ends in a recorded answer, not shipped code.
labels: ["type:maintenance"]
body:
  - type: markdown
    attributes:
      value: |
        An investigation produces a decision, a documented answer, or follow-up tickets. If it concludes that work is needed, open the work as its own issue using the matching form. The maintainer assigns priority and area labels during triage.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: The question to answer and the decision it feeds.
      placeholder: Determine whether the images in `public/content/images/` cover all hero breakpoints, and decide if build-time resizing is needed.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Known facts, constraints, and where to look first.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What closes this investigation.
      placeholder: Answer recorded in a comment with sources; follow-up ticket opened or explicitly ruled out.
    validations:
      required: true
