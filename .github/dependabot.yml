version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-dependencies:
        update-types: ['minor', 'patch']
        patterns: ['*']
    commit-message:
      prefix: build
      include: scope
    labels:
      - dependencies
      - type:maintenance
      - area:dependencies
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: ['minor', 'patch']
        patterns: ['*']
    commit-message:
      prefix: build
      include: scope
    labels:
      - dependencies
      - type:maintenance
      - area:dependencies
    open-pull-requests-limit: 5
