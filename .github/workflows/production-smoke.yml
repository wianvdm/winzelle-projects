name: Production smoke

# Weekly read-only check of the live site (W13, #15). GET requests only: it
# never submits the quote form and never touches the deployment or the form
# recipient. A failure opens an alert issue via failure-alert.yml.
#
# run-name carries the target so failure-alert.yml can tell a production run
# from a controlled test against another origin (inputs are empty on schedule,
# so the default applies).
run-name: Production smoke (${{ inputs.base_url || 'https://winzelle.co.za' }})

on:
  schedule:
    # Mondays 06:00 UTC (08:00 SAST). GitHub pauses scheduled workflows in a
    # public repo after 60 days without repository activity.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      base_url:
        description: >-
          Origin to smoke test, https only and no path. Defaults to
          production; point it at an unreachable host to trigger a
          controlled failure.
        required: false
        default: https://winzelle.co.za
        type: string

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate the base URL
        shell: bash
        env:
          BASE_URL: ${{ inputs.base_url || 'https://winzelle.co.za' }}
        run: |
          if [[ ! $BASE_URL =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "::error::base_url must be an https origin without a path."
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Run the smoke test
        id: smoke
        # smoke.mjs has no npm dependencies, so there is no npm ci.
        env:
          BASE_URL: ${{ inputs.base_url || 'https://winzelle.co.za' }}
        run: node scripts/smoke.mjs "$BASE_URL"
      - name: Write the job summary
        if: always()
        shell: bash
        env:
          BASE_URL: ${{ inputs.base_url || 'https://winzelle.co.za' }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
        run: |
          {
            printf '## Production smoke\n\n'
            printf '| Field | Value |\n| --- | --- |\n'
            printf '| Base URL | `%s` |\n' "$BASE_URL"
            printf '| Result | %s |\n' "${SMOKE_RESULT:-not run}"
            printf '| Time | %s UTC |\n' "$(date -u +'%Y-%m-%d %H:%M:%S')"
          } >> "$GITHUB_STEP_SUMMARY"
