name: Cloudflare check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-check
  cancel-in-progress: true

jobs:
  cloudflare-check:
    name: Cloudflare check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Read-only evidence for W10 (#12): confirms the account, token scope and
    # Worker deployments without deploying, uploading or rolling back. The
    # token is set only on the wrangler steps so dependency install scripts
    # never see it.
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Cloudflare identity
        run: npx wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: List Worker deployments
        run: npx wrangler deployments list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
