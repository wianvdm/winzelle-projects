name: Cloudflare check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-check
  cancel-in-progress: true

jobs:
  cloudflare-check:
    name: Cloudflare check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Read-only evidence for W10 (#12): confirms the token is active and the
    # Worker deployments exist, without printing emails or account names (the
    # repo is public, so Actions logs are world-readable). The token is set
    # only on the steps that need it so install scripts never see it.
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Cloudflare token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify \
            | jq -e '.result.status == "active"'
      - name: List Worker deployments
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deployments list --json --name winzelle-projects \
            | jq '[.[] | {id, created_on, source, version_ids: [.versions[].version_id]}]'
