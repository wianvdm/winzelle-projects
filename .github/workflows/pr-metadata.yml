name: PR metadata

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - unlabeled
    branches:
      - main

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-metadata:
    name: PR metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Run the validator from the base commit so a PR cannot change the rules
      # it is checked against.
      - name: Check out the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Evaluate PR metadata
        run: node scripts/pr-metadata.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
